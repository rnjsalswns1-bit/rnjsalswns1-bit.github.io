<style>
        /* Google Fonts Import */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;700&display=swap');

        /* Custom Animations */
        @keyframes fillBar {
            0% { width: 0%; }
            100% { width: 75%; } /* Hardcoded destination for visual effect */
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.8; box-shadow: 0 0 15px rgba(124, 58, 237, 0.4); }
            50% { opacity: 1; box-shadow: 0 0 30px rgba(124, 58, 237, 0.8); }
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .animate-fill-bar {
            animation: fillBar 1.5s ease-out forwards;
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        .animate-pulse-glow {
            animation: pulseGlow 2s ease-in-out infinite;
        }
        
        .animate-slide-up {
            animation: slideUpFade 0.6s ease-out forwards;
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-500 { animation-delay: 500ms; }
        .delay-700 { animation-delay: 700ms; }

        /* Abyssal Background Pattern */
        .bg-abyssal-pattern {
            background-color: #0B0B0F;
            background-image: radial-gradient(circle at center, rgba(124, 58, 237, 0.05) 0%, transparent 70%);
        }
    </style>
</head>
<body class="bg-abyssal-pattern text-on-surface min-h-screen flex flex-col items-center justify-between overflow-x-hidden font-body-lg text-body-lg">
<!-- Atmospheric Top Glow -->
<div class="fixed top-0 left-1/2 -translate-x-1/2 w-full h-64 bg-epic-purple/10 blur-[100px] pointer-events-none rounded-full"></div>

</header>

<div>

</div>
