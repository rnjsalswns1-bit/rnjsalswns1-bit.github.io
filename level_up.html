<!DOCTYPE html>

<html class="dark" lang="ko"><head>

<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Level Up Life - Level Up</title>

<style>
        .glow-text {
            text-shadow: 0 0 20px rgba(124, 58, 237, 0.6), 0 0 40px rgba(255, 215, 0, 0.4);
        }
        .rays {
            background: conic-gradient(from 0deg at 50% 50%, rgba(124, 58, 237, 0) 0deg, rgba(124, 58, 237, 0.1) 45deg, rgba(124, 58, 237, 0) 90deg, rgba(124, 58, 237, 0.1) 135deg, rgba(124, 58, 237, 0) 180deg, rgba(124, 58, 237, 0.1) 225deg, rgba(124, 58, 237, 0) 270deg, rgba(124, 58, 237, 0.1) 315deg, rgba(124, 58, 237, 0) 360deg);
            animation: rotate 20s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .pulse-border {
            animation: pulse-border 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-border {
            0%, 100% { border-color: rgba(124, 58, 237, 0.3); box-shadow: 0 0 15px rgba(124, 58, 237, 0.2); }
            50% { border-color: rgba(124, 58, 237, 0.8); box-shadow: 0 0 30px rgba(124, 58, 237, 0.6); }
        }
    </style>
</head>
<body class="bg-abyss-black text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden font-body-lg">
<!-- Cinematic Background -->
<div class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none">
<div class="absolute w-[200vw] h-[200vw] rays opacity-50"></div>
<div class="absolute w-96 h-96 bg-epic-purple/20 rounded-full blur-[100px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-lg px-margin-mobile md:px-margin-desktop flex flex-col items-center">
<!-- Header: Level Up Text -->
<div class="text-center mb-xl float">
<h1 class="font-boss-display text-boss-display md:text-[80px] bg-clip-text text-transparent bg-gradient-to-b from-legendary-gold to-epic-purple glow-text uppercase tracking-tighter">
                레벨 업!
            </h1>
</div>
<!-- Level Transition -->
<div class="flex items-center justify-center gap-lg mb-xxl w-full">
<div class="flex flex-col items-center">
<span class="font-caption text-caption text-outline mb-xs uppercase">현재</span>
<span class="font-level-display text-level-display text-on-surface-variant opacity-70">LV. 1</span>
</div>
<div class="flex items-center justify-center px-sm">
<span class="material-symbols-outlined text-epic-purple text-4xl animate-pulse">
                    double_arrow
                </span>
</div>
<div class="flex flex-col items-center relative">
<span class="font-caption text-caption text-legendary-gold mb-xs uppercase glow-text">변경</span>
<span class="font-level-display text-level-display text-on-surface drop-shadow-[0_0_15px_rgba(124,58,237,0.8)]">LV. 19</span>
<!-- Inner Glow for New Level -->
<div class="absolute inset-0 bg-epic-purple/10 blur-xl rounded-full z-[-1]"></div>
</div>
</div>
<!-- Rewards Container -->
<div class="w-full bg-dungeon-gray/80 backdrop-blur-md rounded-xl border border-outline-variant/30 p-lg mb-xxl shadow-[0_8px_32px_rgba(0,0,0,0.5)] relative overflow-hidden">
<!-- Ghost Border -->
<div class="absolute inset-0 border border-white/5 rounded-xl pointer-events-none"></div>
<h2 class="font-section-title text-section-title text-on-surface mb-lg text-center border-b border-outline-variant/20 pb-sm">해금된 보상</h2>
<div class="flex flex-col gap-md">
<!-- Status Points -->
<div class="flex items-center gap-md bg-shadow-slate p-sm rounded-lg border border-outline-variant/10 hover:border-epic-purple/30 transition-colors">
<div class="w-10 h-10 rounded-full bg-exp-blue/20 flex items-center justify-center text-exp-blue shadow-[0_0_10px_rgba(59,130,246,0.3)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
</div>
<div class="flex-1">
<p class="font-quest-title text-quest-title text-on-surface">+5 스탯 포인트</p>
</div>
</div>
<!-- New Title -->
<div class="flex items-center gap-md bg-shadow-slate p-sm rounded-lg border border-outline-variant/10 hover:border-legendary-gold/30 transition-colors relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-legendary-gold shadow-[0_0_8px_#FFD700]"></div>
<div class="w-10 h-10 rounded-full bg-legendary-gold/20 flex items-center justify-center text-legendary-gold shadow-[0_0_10px_rgba(255,215,0,0.3)] ml-xs">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
</div>
<div class="flex-1">
<p class="font-caption text-caption text-legendary-gold uppercase tracking-wider mb-[2px]">신규 칭호</p>
<p class="font-quest-title text-quest-title text-on-surface">그림자 보행자</p>
</div>
</div>
<!-- Gold -->
<div class="flex items-center gap-md bg-shadow-slate p-sm rounded-lg border border-outline-variant/10 hover:border-tertiary/30 transition-colors">
<div class="w-10 h-10 rounded-full bg-tertiary/20 flex items-center justify-center text-tertiary shadow-[0_0_10px_rgba(249,189,34,0.3)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">toll</span>
</div>
<div class="flex-1">
<p class="font-quest-title text-quest-title text-on-surface">+500 골드</p>
</div>
</div>
</div>
</div>
<!-- Confirm Button -->
<button class="w-full md:w-auto px-xxl py-md bg-epic-purple text-on-surface font-card-title text-card-title rounded-lg pulse-border relative overflow-hidden group transition-transform active:scale-95">
<span class="relative z-10 tracking-widest uppercase">운명을 받아들이기</span>
<!-- Button hover effect -->
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity z-0"></div>
</button>
</main>
</body></html>
