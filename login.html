<style>

<body class="bg-abyss-black text-on-surface min-h-screen relative overflow-hidden font-body-lg">
<!-- Background Animations -->
<div class="fixed inset-0 w-full h-full z-0">
</div>
<!-- Center 3D Crystal Core -->
<div class="fixed inset-0 flex items-center justify-center z-0 pointer-events-none opacity-40 mix-blend-screen">
</div>
<!-- Scanline Overlay -->
<div class="fixed inset-0 w-full h-full scanlines"></div>
<!-- Main Content Canvas -->
<main class="relative z-20 min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Login Container -->
<div class="glass-card w-full max-w-md rounded-xl p-lg relative overflow-hidden">
<!-- Decorative corner elements -->
<div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-epic-purple/50"></div>
<div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-epic-purple/50"></div>
<div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-epic-purple/50"></div>
<div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-epic-purple/50"></div>
<!-- Logo Area -->
<div class="flex flex-col items-center mb-xl">
<div class="w-32 h-32 mb-sm relative">
<div class="absolute inset-0 bg-epic-purple/20 rounded-full blur-xl animate-pulse"></div>
<img alt="Level Up Life Logo" class="w-full h-full object-contain relative z-10 drop-shadow-[0_0_10px_rgba(124,58,237,0.5)]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDhGaa77Wwtv7hHQSOKV-EiSN_DQVbtbfE-24JyWjiKtzNYCV9IFaVR5Yw9sd-dl8NX1MuN7sQIibmMxPito6Y7vW9KucmHU6zAUPN3O1CIGqtII4QAwkrRzLdNqGQQ3xFif0jwz9e1NwdkY9tdV2E3U51ezJdxpLdvMgtU-2avTAJSuOTiPreSHIA2YJLky1K54n5Ghya2_v7RUk21HGzw9C3itTC7FJAFkUPK3sLnHAh_i0SAJoS5PZB0n774_bFX0T8E09l2yqg"/>
</div>
<h1 class="font-section-title text-section-title md:font-section-title md:text-section-title text-primary uppercase tracking-widest glow-epic-text">시스템 로그인</h1>
</div>
<!-- Login Form -->
<form class="space-y-md w-full">
<!-- Hunter ID Field -->
<div class="space-y-xs">
<label class="font-caption text-caption text-primary-fixed-dim uppercase tracking-wider block" for="hunter-id">플레이어 ID</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-epic-purple transition-colors">person</span>
<input class="w-full bg-surface-container-high border-outline-variant text-on-surface font-body-lg pl-xl pr-sm py-sm rounded focus:border-epic-purple focus:ring-1 focus:ring-epic-purple transition-all outline-none placeholder:text-outline-variant/50" id="hunter-id" placeholder="이메일 주소 입력" type="email"/>
</div>
</div>
<!-- Secret Key Field -->
<div class="space-y-xs">
<label class="font-caption text-caption text-primary-fixed-dim uppercase tracking-wider block" for="secret-key">시크릿 키 (비밀번호)</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-epic-purple transition-colors">key</span>
<input class="w-full bg-surface-container-high border-outline-variant text-on-surface font-body-lg pl-xl pr-sm py-sm rounded focus:border-epic-purple focus:ring-1 focus:ring-epic-purple transition-all outline-none placeholder:text-outline-variant/50" id="secret-key" placeholder="비밀번호 입력" type="password"/>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex justify-between items-center pt-xs pb-sm">
<label class="flex items-center space-x-xs cursor-pointer group">
<input class="form-checkbox bg-surface-container-high border-outline-variant text-epic-purple rounded-sm focus:ring-epic-purple focus:ring-offset-0 focus:ring-offset-transparent w-4 h-4" type="checkbox"/>
<span class="font-caption text-caption text-on-surface-variant group-hover:text-primary transition-colors">자동 로그인</span>
</label>
<a class="font-caption text-caption text-epic-purple hover:text-primary-fixed transition-colors" href="#">시크릿 키 찾기</a>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-epic-purple text-on-primary font-quest-title text-quest-title uppercase py-sm rounded glow-epic glow-epic-active transition-all duration-300 hover:bg-inverse-primary relative overflow-hidden group" type="button">
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
<span class="relative z-10 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">login</span>
                        시스템 접속
                    </span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-lg">
<div class="flex-grow h-px bg-outline-variant/30"></div>
<span class="font-caption text-caption text-outline px-sm">길드 계정으로 접속</span>
<div class="flex-grow h-px bg-outline-variant/30"></div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-sm">
<button class="flex items-center justify-center gap-xs bg-surface-container border border-outline-variant/50 hover:bg-shadow-slate hover:border-epic-purple/50 text-on-surface font-body-sm text-body-sm py-sm rounded transition-all" type="button">
<span class="material-symbols-outlined text-lg">g_translate</span>
                    Google
                </button>
<button class="flex items-center justify-center gap-xs bg-surface-container border border-outline-variant/50 hover:bg-shadow-slate hover:border-epic-purple/50 text-on-surface font-body-sm text-body-sm py-sm rounded transition-all" type="button">
<span class="material-symbols-outlined text-lg">forum</span>
                    Discord
                </button>
</div>
<!-- Warning Footer -->
<div class="mt-lg pt-sm border-t border-health-red/20 text-center">
<p class="font-caption text-caption text-health-red/80 flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[14px]">warning</span>
                    권한이 없는 사용자의 접근을 금지합니다.
                </p>
</div>
</div>

<style>
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
        .glow-epic-text {

        }
